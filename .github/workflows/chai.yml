name: chai
# מעדכן את טבלת הנץ הנראה מ"לוחות חי" – פעם בחודש ובהפעלה ידנית
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/chai.py
      - name: commit if changed
        run: |
          if git diff --quiet data/netz-chai.json; then echo "no change"; exit 0; fi
          ./bump.sh
          git config user.email "actions@github.com" && git config user.name "chai-bot"
          git add data/netz-chai.json version.txt js/build.js
          git commit -qm "עדכון לוח חי (הנץ הנראה)"
          git push
