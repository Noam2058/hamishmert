name: promo-shots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji >/dev/null || true
      - run: node promo/shots.mjs
      - name: push screenshots to promo-assets branch
        run: |
          cd out
          git init -q && git checkout -q -b promo-assets
          git config user.email "actions@github.com" && git config user.name "actions"
          git add -A && git commit -qm "promo screenshots"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" promo-assets
